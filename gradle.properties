# =======================================================================
# Gradle / build environment
# =======================================================================
# Minecraft 1.20.1 + Forge require Java 17. Set JAVA_HOME to a Java 17 JDK
# before invoking Gradle; do not hard-code a machine-specific path here.
# Memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.23
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)

# Mapping channel: 'official' = pure Mojang names, 'parchment' = Mojang names plus
# community parameter names/javadocs (requires the librarian plugin in build.gradle).
mapping_channel=parchment
# For the 'parchment' channel the version is YYYY.MM.DD-MCVersion
mapping_version=2023.09.03-1.20.1


## Mod Properties

mod_id=croety
mod_name=Croety
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.croety
mod_authors=Croety Dev
mod_description=A Create + Goety integration mod for Minecraft 1.20.1.


## Third-party mod versions (verified against the live repositories)

# Create 6.0.8 for MC 1.20.1 -- build 291 is the maven build of release 6.0.8.
# The ':slim' classifier is the dev artifact WITHOUT jar-in-jar, so the libraries
# Create bundles at runtime are declared separately below at the exact same versions.
create_version=6.0.8-291
flywheel_version=1.0.5-264
ponder_version=1.0.91
registrate_version=MC1.20-1.3.3
mixinextras_version=0.4.1
# Goety 2.5.57.3 requires Curios; Patchouli is a soft dependency.
goety_version=2.5.57.3
curios_version=5.14.1+1.20.1
patchouli_version=1.20.1-85-FORGE
jei_version=15.59.0.210
